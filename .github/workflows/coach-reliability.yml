name: Reading Coach reliability
on:
  push:
    branches: [codex/coach-reliability-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: bulig-isolated-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BULIG_TEST_DB_HOST: 127.0.0.1
      BULIG_TEST_DB_PORT: 3306
      BULIG_TEST_DB_NAME: bulig_test
      BULIG_TEST_DB_USER: root
      BULIG_TEST_DB_PASS: bulig-isolated-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring php-xml php-gd php-zip mariadb-client
      - run: node --check public/assets/coach.js && node tests/coach-regressions.cjs && node tests/audit-regressions.cjs
      - run: python3 tests/run_tests.py
      - run: |
          python3 -m venv /tmp/bulig-ui
          /tmp/bulig-ui/bin/pip install playwright
          /tmp/bulig-ui/bin/playwright install --with-deps chromium
      - run: /tmp/bulig-ui/bin/python tests/reading_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coach-test-results
          path: |
            tests/ui-preview/
            tests/last-run-server.log
          retention-days: 7
